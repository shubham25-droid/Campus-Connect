<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="whiteBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="whiteAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#ff9600"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (48x48) -->
  <g transform="translate(6, 8)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#051c33" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2"/>

    <!-- Left C -->
    <path d="M 25 13
             C 17 13 11 18 11 25
             C 11 32 17 37 25 37"
          fill="none"
          stroke="url(#whiteBlue)"
          stroke-width="5"
          stroke-linecap="round"/>

    <!-- Right C -->
    <path d="M 23 37
             C 31 37 37 32 37 25
             C 37 18 31 13 23 13"
          fill="none"
          stroke="url(#whiteAmber)"
          stroke-width="5"
          stroke-linecap="round"/>

    <!-- Spark -->
    <path d="M 24 20 C 24 22.5 22.5 24 20 24 C 22.5 24 24 25.5 24 28 C 24 25.5 25.5 24 28 24 C 25.5 24 24 22.5 24 20 Z" fill="#ffffff"/>
    <circle cx="24" cy="24" r="1.1" fill="#ff9600"/>
  </g>

  <!-- Typography Wordmark Right (White & Amber) -->
  <g transform="translate(66, 12)">
    <text x="0" y="27" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.6" fill="#ffffff">
      Campus<tspan fill="#ff9600">Connect</tspan>
    </text>
    <text x="1" y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" letter-spacing="1.2" fill="#94a3b8">
      LTCE CAMPUS OPPORTUNITY HUB
    </text>
  </g>
</svg>
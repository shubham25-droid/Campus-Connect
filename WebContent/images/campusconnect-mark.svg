<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082c50"/>
      <stop offset="100%" stop-color="#031627"/>
    </linearGradient>
    <linearGradient id="blueLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="amberLoop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#ff9600"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Clean Rounded Base Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="4.75" y="4.75" width="90.5" height="90.5" rx="21.25" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Left 'C' - Campus (Royal Sapphire Gradient) -->
  <path d="M 52 26
           C 36 26 24 36 24 50
           C 24 64 36 74 52 74"
        fill="none"
        stroke="url(#blueLoop)"
        stroke-width="9.5"
        stroke-linecap="round"/>

  <!-- Right 'C' - Connect (Golden Amber Gradient) -->
  <path d="M 48 74
           C 64 74 76 64 76 50
           C 76 36 64 26 48 26"
        fill="none"
        stroke="url(#amberLoop)"
        stroke-width="9.5"
        stroke-linecap="round"/>

  <!-- Central Opportunity Spark / Diamond Star -->
  <path d="M 50 42 
           C 50 47 47 50 42 50 
           C 47 50 50 53 50 58 
           C 50 53 53 50 58 50 
           C 53 50 50 47 50 42 Z" 
        fill="#ffffff"/>
  <circle cx="50" cy="50" r="2.2" fill="#ff9600"/>
</svg>
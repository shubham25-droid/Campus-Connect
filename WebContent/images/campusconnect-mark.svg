<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Royal Sapphire Gradient (Campus / Academics / Trust) -->
    <linearGradient id="ccSapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082c50" />
      <stop offset="60%" stop-color="#0d4379" />
      <stop offset="100%" stop-color="#1e6bb8" />
    </linearGradient>

    <!-- Golden Amber Gradient (Connect / Energy / Opportunity) -->
    <linearGradient id="ccAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#ff9600" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Ambient Shadow for Modern Depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#082c50" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background App Squircle (Clean Minimal Canvas) -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softGlow)"/>

  <!-- Geometric Infinity Connection Motif:
       Loop 1 (Campus - Left Loop in Royal Sapphire) -->
  <path d="M 50 32
           C 36 32, 22 40, 22 52
           C 22 64, 34 70, 48 64
           C 54 61, 58 56, 62 50
           C 58 44, 54 39, 50 32 Z"
        fill="url(#ccSapphire)" />

  <!-- Loop 2 (Connect - Right Loop in Golden Amber) -->
  <path d="M 50 68
           C 64 68, 78 60, 78 48
           C 78 36, 66 30, 52 36
           C 46 39, 42 44, 38 50
           C 42 56, 46 61, 50 68 Z"
        fill="url(#ccAmber)" />

  <!-- Dynamic Center Overlap / Intersection Node -->
  <path d="M 50 38
           C 56 43, 56 57, 50 62
           C 44 57, 44 43, 50 38 Z"
        fill="#ffffff"
        opacity="0.95" />

  <!-- Core Opportunity Spark (The Beacon at the Center of Connection) -->
  <path d="M 50 43
           Q 50 50, 57 50
           Q 50 50, 50 57
           Q 50 50, 43 50
           Q 50 50, 50 43 Z"
        fill="url(#ccAmber)" />
</svg>

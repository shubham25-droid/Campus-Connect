<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <!-- LTCE Royal Blue Gradient -->
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2d52" />
      <stop offset="60%" stop-color="#0d4379" />
      <stop offset="100%" stop-color="#1b659f" />
    </linearGradient>

    <!-- LTCE Gold / Saffron Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9600" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left Icon Mark (74x74) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="74" height="74" rx="18" fill="url(#markGrad)" stroke="#3c7cae" stroke-width="1.8" filter="url(#markShadow)"/>

    <!-- Subtle Orbit Circle -->
    <circle cx="37" cy="37" r="28" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 3"/>
    
    <!-- Outer 'C' (Campus) -->
    <path d="M 48 20 C 26 15 14 27 16 42 C 17 53 28 60 46 58" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Inner 'C' (Connect) in LTCE Amber -->
    <path d="M 53 28 C 38 23 25 31 27 41 C 28 49 39 53 54 48" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="3.8" 
          stroke-linecap="round" />

    <!-- Graduation Cap Core -->
    <polygon points="37,25 48,30 37,35 26,30" fill="url(#goldGrad)" />
    <path d="M 30 33 L 30 38 C 30 41 44 41 44 38 L 44 33" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Nodes -->
    <circle cx="48" cy="20" r="3.2" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    <circle cx="46" cy="58" r="3.2" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    <circle cx="53" cy="28" r="2.8" fill="#ff9600" stroke="#ffffff" stroke-width="1" />
    <circle cx="54" cy="48" r="2.8" fill="#ff9600" stroke="#ffffff" stroke-width="1" />
    <circle cx="37" cy="37" r="2.2" fill="#ffffff" />
  </g>

  <!-- Typography Brand Block -->
  <g transform="translate(96, 14)">
    <!-- Wordmark -->
    <text x="0" y="32" font-family="'Inter', 'Roboto', 'Arial', sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5" fill="#0d4379">
      CAMPUS<tspan fill="#ff9600">CONNECT</tspan>
    </text>

    <!-- Institutional Affiliation Tagline -->
    <text x="0" y="52" font-family="'Inter', 'Roboto', 'Arial', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#475569" text-transform="uppercase">
      LOKMANYA TILAK COLLEGE OF ENGINEERING
    </text>

    <!-- Accreditation & Autonomous Strip -->
    <g transform="translate(0, 58)">
      <rect x="0" y="4" width="76" height="15" rx="3" fill="#e0f2fe" />
      <text x="6" y="15" font-family="'Inter', 'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#0369a1">AUTONOMOUS</text>

      <rect x="82" y="4" width="84" height="15" rx="3" fill="#fef3c7" />
      <text x="88" y="15" font-family="'Inter', 'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#b45309">NAAC 'A' GRADE</text>

      <rect x="172" y="4" width="82" height="15" rx="3" fill="#ecfdf5" />
      <text x="178" y="15" font-family="'Inter', 'Roboto', sans-serif" font-size="8.5" font-weight="700" fill="#047857">NBA ACCREDITED</text>
    </g>
  </g>
</svg>
